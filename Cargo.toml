[workspace]
members = [".", "crates/code-reviewer"]
default-members = [".", "crates/code-reviewer"]
resolver = "2"

[package]
name = "cheap-otto"
version = "0.2.0"
edition = "2024"
description = "Turn any spare MacBook or old laptop into a Cross-OS Dev Bridge, Parallel Agent Worktree Farm, and Autonomous Multi-Lens CI Code Reviewer."
license = "MIT"
repository = "https://github.com/cokitron/cheap-otto"

[[bin]]
name = "cheap-otto"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "fs", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
