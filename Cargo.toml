[package]
name = "cheap-otto"
version = "0.1.0"
edition = "2024"
description = "Turn any spare MacBook or old laptop into a 24/7 headless AI agent, residential browser worker, local AI gateway, and CI runner."
license = "MIT"
repository = "https://github.com/cokitron/cheap-otto"

[[bin]]
name = "cheap-otto"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "fs", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
