name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-hygiene:
    name: PR Governance & Secret Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Conventional PR title & branch hygiene
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          set -eu
          if ! printf '%s\n' "$PR_TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|perf|build|revert)(\([a-z0-9._/-]+\))?!?: [^[:space:]].*'; then
            echo "::error::PR title must follow Conventional Commits (e.g. 'feat(bridge): ...' or 'fix(code-reviewer): ...'). Got: $PR_TITLE"
            exit 1
          fi
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            if ! printf '%s\n' "$HEAD_REF" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|perf|otto|dependabot|claude)/[a-zA-Z0-9._/-]+$'; then
              echo "::error::Same-repo branch '$HEAD_REF' must use an approved prefix (feat/, fix/, chore/, docs/, refactor/, test/, ci/, perf/, otto/, dependabot/)."
              exit 1
            fi
          fi

      - name: Block tracked secrets and local runtime configs
        run: |
          set -eu
          FORBIDDEN=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.token$|\.pem$|\.key$|^peer\.json$|^state-backup\.json$|^crates/code-reviewer/config/repos\.toml$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$FORBIDDEN" ]; then
            echo "::error::Tracked secret or local runtime config detected:"
            printf '%s\n' "$FORBIDDEN"
            exit 1
          fi

  rust-gate:
    name: Rust Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Lint with Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run deterministic unit & integration tests
        run: cargo test --workspace --all-targets --locked
